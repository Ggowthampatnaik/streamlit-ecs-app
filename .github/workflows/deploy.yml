name: Deploy to App Runner

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: streamlit-app
  APP_RUNNER_SERVICE: streamlit-service

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: arn:aws:iam::493272324412:role/github-ecs-role
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build & Push Image
      run: |
        IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}

        docker build -t $IMAGE_URI .
        docker push $IMAGE_URI

        echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

    # 🔍 Check if service exists
    - name: Check App Runner Service
      id: check-service
      run: |
        SERVICE_ARN=$(aws apprunner list-services \
          --query "ServiceSummaryList[?ServiceName=='$APP_RUNNER_SERVICE'].ServiceArn" \
          --output text)

        echo "SERVICE_ARN=$SERVICE_ARN" >> $GITHUB_ENV

    # 🆕 Create (if not exists)
    - name: Create App Runner Service
      if: env.SERVICE_ARN == ''
      run: |
        aws apprunner create-service \
          --service-name $APP_RUNNER_SERVICE \
          --source-configuration "{
            \"ImageRepository\": {
              \"ImageIdentifier\": \"${IMAGE_URI}\",
              \"ImageRepositoryType\": \"ECR\",
              \"ImageConfiguration\": {
                \"Port\": \"8501\"
              }
            },
            \"AutoDeploymentsEnabled\": true
          }"

    # 🔄 Update (if exists)
    - name: Update App Runner Service
      if: env.SERVICE_ARN != ''
      run: |
        aws apprunner update-service \
          --service-arn $SERVICE_ARN \
          --source-configuration "{
            \"ImageRepository\": {
              \"ImageIdentifier\": \"${IMAGE_URI}\",
              \"ImageRepositoryType\": \"ECR\",
              \"ImageConfiguration\": {
                \"Port\": \"8501\"
              }
            }
          }"
